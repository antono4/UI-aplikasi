<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="UI-aplikasi - by Antono4">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Aplikasi Alam Semesta (Weather Effect Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&display=swap');
        
        body { font-family: 'Quicksand', sans-serif; transition: background-color 0.3s; overflow-x: hidden; }
        
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        .float-animation { animation: float 6s ease-in-out infinite; }
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse-btn { animation: pulse-soft 3s ease-in-out infinite; }

        body.theme-dark { background-color: #1a1a2e; color: #ffffff; }
        body.theme-dark #phone-wrapper { background-color: #16213e; ring-color: #4e4e6a; }
        
        body.theme-light { background-color: #fdf2f8; color: #4a1d3f; }
        body.theme-light #phone-wrapper { background-color: #ffffff; ring-color: #fbcfe8; box-shadow: 0 25px 50px -12px rgba(236, 72, 153, 0.2); }
        body.theme-light #time { color: #db2777; } 
        
        .bg-floral { background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000'); background-size: cover; background-position: right; }
        
        #rain-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .tap-effect:active { transform: scale(0.9); transition: transform 0.1s; }
        #phone-wrapper { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="theme-dark flex items-center justify-center min-h-screen p-4">

    <div id="phone-wrapper" class="float-animation rounded-[3rem] p-8 shadow-2xl relative overflow-hidden ring-4 select-none flex w-[360px] h-[780px]">
        
        <div class="absolute inset-0 bg-floral opacity-50"></div>
        <canvas id="rain-canvas"></canvas>
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent z-10"></div>
        
        <div id="content-area" class="relative z-20 w-full h-full flex flex-col justify-end">
            <div id="header-section" class="mb-8 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-pink-500/30 flex items-center justify-center text-pink-200 font-bold text-lg animate-spin-slow">✨</div>
                <span class="text-sm font-medium tracking-wide">by Antono</span>
            </div>

            <div>
                <p class="text-xs opacity-80 tracking-widest uppercase font-bold" id="date-display">--/--</p>
                <h1 class="text-6xl font-extrabold tracking-tighter">MER.</h1>
                <p class="text-5xl font-bold text-pink-400 mt-2" id="time">00:00:00</p>
            </div>

            <div class="mt-10 bg-white/20 backdrop-blur-md rounded-2xl p-4 border border-white/20 mb-10">
                <div class="flex items-center gap-4">
                    <span id="weather-icon" class="text-4xl animate-bounce">🌧️</span>
                    <p class="text-xs font-semibold tracking-wide" id="weather">
                        San Jose: <span id="temp-display">25</span>°C <br> <span class="opacity-90">Sedang hujan rintik.</span>
                    </p>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="toggleOrientation()" class="pulse-btn tap-effect w-14 h-14 bg-pink-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-pink-500/30 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 3v18"/></svg>
                </button>
                
                <button onclick="toggleTheme()" class="tap-effect w-14 h-14 bg-zinc-700/50 rounded-2xl flex items-center justify-center text-white transition-all">
                    <span id="theme-icon">🌙</span>
                </button>

                <a href="https://antono4.github.io/" class="pulse-btn tap-effect w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center border border-white/20 hover:bg-white/30 text-xl transition-all">
                    📞
                </a>
            </div>
        </div>
    </div>

    <script>
        // Rain Effect Logic
        const canvas = document.getElementById('rain-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 360; canvas.height = 780;
        const drops = [];
        for(let i=0; i<100; i++) drops.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, l: Math.random()*10+5, s: Math.random()*5+2});

        function drawRain() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            drops.forEach(d => {
                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.l);
                ctx.stroke();
                d.y += d.s;
                if(d.y > canvas.height) d.y = -10;
            });
            requestAnimationFrame(drawRain);
        }
        drawRain();

        // Original Logic
        let isLandscape = false;
        const wrapper = document.getElementById('phone-wrapper');

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.classList.contains('theme-dark')) {
                body.classList.replace('theme-dark', 'theme-light');
                icon.textContent = '☀️';
            } else {
                body.classList.replace('theme-light', 'theme-dark');
                icon.textContent = '🌙';
            }
        }

        function initData() {
            const now = new Date();
            document.getElementById('date-display').textContent = now.toLocaleDateString('id-ID', { month: 'long', day: 'numeric' });
            const temp = Math.floor(Math.random() * 10 + 20);
            document.getElementById('temp-display').textContent = temp;
        }

        function toggleOrientation() {
            isLandscape = !isLandscape;
            wrapper.style.width = isLandscape ? '780px' : '360px';
            wrapper.style.height = isLandscape ? '360px' : '780px';
            canvas.width = isLandscape ? 780 : 360;
            canvas.height = isLandscape ? 360 : 780;
            document.getElementById('content-area').classList.replace(isLandscape ? 'flex-col' : 'flex-row', isLandscape ? 'flex-row' : 'flex-col');
            document.getElementById('header-section').classList.toggle('hidden', isLandscape);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('time').textContent = now.toTimeString().split(' ')[0];
        }

        initData();
        setInterval(updateClock, 1000);
        updateClock();
    </script>

    <footer style="text-align:center;padding:20px;font-size:14px;color:#666;">
        Created by Antono
    </footer>
</body>
</html>
